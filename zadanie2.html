
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вертикальное меню</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

/* Основное меню */
.menu {
    width: 230px;
}

/* Каждый пункт меню */
.item {
    position: relative;
}

/* Ссылки меню */
.item > a, .submenu a {
    display: block;
    padding: 15px;
    color: #333;
    text-decoration: none;
    background: linear-gradient(#eeeeee, #cccccc);
    border: 1px solid #aaa;
}

/* Наведение */
.item > a:hover, .submenu a:hover {
    background: #a9cce3;
}

/* Выпадающее подменю */
.submenu {
    display: none;
    position: absolute;
    left: 100%;
    top: 0;
    width: 190px;
    z-index: 10;
}

/* Показать подменю */
.item:hover > .submenu {
    display: block;
}
</style>
</head>

<body>

<h2>Вертикальное меню</h2>

<div class="menu">

    <div class="item">
        <a href="#">Главная</a>
        <div class="submenu">
            <a href="#">Главная страница</a>
            <a href="#">Контакты</a>
            <a href="#">О нас</a>
        </div>
    </div>

    <div class="item">
        <a href="#">Отделы продаж</a>
    </div>

    <div class="item">
        <a href="#">Поставщики</a>
        <div class="submenu">
            <a href="#">ООО «Дизайн»</a>
            <a href="#">ООО «Арт»</a>
            <a href="#">ООО «Фотостиль»</a>
        </div>
    </div>

    <div class="item">
        <a href="#">Наши услуги</a>
    </div>

    <div class="item">
        <a href="#">Контакты</a>
    </div>

    <div class="item">
        <a href="#">О нас</a>
    </div>

</div>

</body>
</html>
